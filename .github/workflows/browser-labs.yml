name: Browser labs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-labs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Chromium (${{ matrix.framework }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [javascript, react-vite, next-app]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and system libraries
        run: pnpm exec playwright install --with-deps chromium
      - name: Lint Web Worker lab
        if: matrix.framework == 'react-vite'
        run: pnpm exec eslint labs/react/web-worker --max-warnings=0
      - name: Test worker behavior
        if: matrix.framework == 'react-vite'
        run: pnpm exec vitest run labs/react/web-worker/tests/*.test.ts
      - name: Test all labs for this framework
        run: pnpm lab:test:browser ${{ matrix.framework }}
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: chromium-${{ matrix.framework }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
